[package]
name = "charli3-staking-participation"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
authors = ["Charli3 Team <info@charli3.io>"]
description = "Staking participation pallet (skeleton) for Charli3"
repository = "https://github.com/Charli3-Official/charli3-substrate-oracle-core"
readme = "README.md"

[dependencies]
parity-scale-codec = { version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sp-std = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2509" }
frame-support = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2509" }
frame-system = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2509", optional = true }
pallet-timestamp = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2509", optional = true }
minicbor = { version = "0.26.5", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-std/std",
    "frame-support/std",
    "frame-system?/std",
    "pallet-timestamp?/std",
]

pallet = [
    "frame-system",
    "pallet-timestamp",
]

try-runtime = [
    "frame-support/try-runtime",
    "frame-system?/try-runtime",
]

runtime-benchmarks = ["frame-support/runtime-benchmarks"]
